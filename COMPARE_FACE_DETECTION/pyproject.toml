[project]
name = "face-detection-benchmark"
version = "0.1.0"
description = "Reproducible WIDER FACE benchmark for Haar Cascade, MTCNN and RetinaFace-MobileNet0.25"
requires-python = "==3.11.7"
dependencies = [
  "facenet-pytorch==2.6.0",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "pandas==2.2.3",
  "Pillow==10.2.0",
  "psutil==6.1.0",
  "PyYAML==6.0.2",
  "scipy==1.12.0",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "tqdm==4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_benchmark"]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
