[project]
name = "deepface-emotion-finetuning"
version = "0.1.0"
description = "Fine-tune DeepFace Emotion CNN on FER-2013 Training and PublicTest"
requires-python = "==3.11.7"
dependencies = [
  "deepface==0.0.101",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "tensorflow==2.21.0",
  "tf-keras==2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_finetuning"]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
