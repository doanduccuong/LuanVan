[project]
name = "facial-expression-benchmark"
version = "0.1.0"
description = "Reproducible FER-2013 benchmark for LBP-SVM and pretrained or externally fine-tuned DeepFace Emotion"
requires-python = "==3.11.7"
dependencies = [
  "joblib==1.4.2",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "Pillow==10.2.0",
  "psutil==6.1.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
deepface = [
  "deepface==0.0.101",
  "tensorflow==2.21.0",
  "tf-keras==2.21.0",
  "opencv-python==4.11.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expression_benchmark"]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
