run:
  random_seed: 20261006
  smoke_test: true
  final_evaluation: true

paths:
  fer2013_csv: data/smoke_fer2013.csv
  results_root: results

dataset:
  labels: [Angry, Disgust, Fear, Happy, Sad, Surprise, Neutral]
  expected_counts:
    Training: 28
    PublicTest: 14
    PrivateTest: 14
  strict_counts: false
  fail_on_cross_split_duplicates: true

lbp_svm:
  points: 8
  radius: 1
  grid_rows: 6
  grid_cols: 6
  candidates:
    - {kernel: linear, C: 1.0}

deepface_emotion:
  batch_size: 14
  weights_path: ~/.deepface/weights/facial_expression_model_weights.h5

latency:
  warmup_samples: 1
  repeats: 1

selection:
  primary_metric: macro_f1
  tie_margin: 0.01
  tie_breakers: [latency_p95_ms, model_size_bytes]
