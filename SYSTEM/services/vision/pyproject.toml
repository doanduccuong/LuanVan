[project]
name = "touchpoint-vision-service"
version = "0.1.0"
description = "Face detection, expression recognition and face embedding service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=1.26,<2.0",
  "opencv-python-headless>=4.10,<5.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[project.optional-dependencies]
models = [
  "deepface>=0.0.93,<1.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
