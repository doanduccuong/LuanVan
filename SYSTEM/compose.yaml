services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: touchpoint
      POSTGRES_USER: touchpoint
      POSTGRES_PASSWORD: touchpoint
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchpoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  vision:
    build:
      context: services/vision
      args:
        INSTALL_MODEL_DEPS: ${INSTALL_MODEL_DEPS:-true}
    env_file: ${ENV_FILE:-.env.example}
    volumes:
      - ../COMPARE_FACE_DETECTION/vendor/Pytorch_Retinaface:/models/Pytorch_Retinaface:ro
      - ../COMPARE_FACE_DETECTION/weights/mobilenet0.25_Final.pth:/models/mobilenet0.25_Final.pth:ro
      - ${HOME}/.deepface:/root/.deepface:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 10s
      retries: 20

  migrate:
    # Sequenzo 0.1.42 publishes Linux wheels for x86_64 but not Linux ARM64.
    # On Apple Silicon, Docker emulates this small API image while vision stays native ARM64.
    platform: linux/amd64
    build:
      context: apps/api
    env_file: ${ENV_FILE:-.env.example}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    platform: linux/amd64
    build:
      context: apps/api
    env_file: ${ENV_FILE:-.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vision:
        condition: service_healthy
    volumes:
      - ./artifacts:/artifacts
    ports:
      - "8000:8000"

  simulator:
    build:
      context: services/simulator
    env_file: ${ENV_FILE:-.env.example}
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_started
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
    depends_on:
      - api
      - simulator
    volumes:
      - ${DEMO_DATASET_ROOT:-./data/generated/kdef_demo}/customer_images:/usr/share/nginx/html/demo/customers:ro
    ports:
      - "8080:80"

volumes:
  postgres-data:
