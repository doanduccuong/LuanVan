services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: touchpoint
      POSTGRES_USER: touchpoint
      POSTGRES_PASSWORD: touchpoint
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchpoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  vision:
    build:
      context: services/vision
      args:
        INSTALL_MODEL_DEPS: ${INSTALL_MODEL_DEPS:-false}
    env_file: ${ENV_FILE:-.env.example}
    volumes:
      - ../COMPARE_FACE_DETECTION/vendor/Pytorch_Retinaface:/models/Pytorch_Retinaface:ro
      - ../COMPARE_FACE_DETECTION/weights/mobilenet0.25_Final.pth:/models/mobilenet0.25_Final.pth:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 10s
      retries: 20

  migrate:
    build:
      context: apps/api
    env_file: ${ENV_FILE:-.env.example}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: apps/api
    env_file: ${ENV_FILE:-.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vision:
        condition: service_healthy
    volumes:
      - ./artifacts:/artifacts
    ports:
      - "8000:8000"

  simulator:
    build:
      context: services/simulator
    env_file: ${ENV_FILE:-.env.example}
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_started
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
    depends_on:
      - api
      - simulator
    volumes:
      - ./fixtures/demo_dataset/customer_images:/usr/share/nginx/html/demo/customers:ro
    ports:
      - "8080:80"

volumes:
  postgres-data:
